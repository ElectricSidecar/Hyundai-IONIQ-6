generations:
  - name: "First Generation (Pre-Facelift)"
    start_year: 2022
    end_year: 2025
    description: "The Hyundai IONIQ 6 is the second dedicated electric vehicle in Hyundai's IONIQ sub-brand, built on the same Electric Global Modular Platform (E-GMP) as the IONIQ 5. Unlike its crossover sibling, the IONIQ 6 features a dramatic streamliner design inspired by the Prophecy concept car, with an extremely aerodynamic silhouette that achieves a drag coefficient of just 0.21—among the lowest of any production car. The exterior combines smooth, flowing surfaces with pixel-like lighting elements that maintain the IONIQ design language, while the elongated fastback profile maximizes efficiency and range. Available with either a 53 kWh or 77.4 kWh battery pack (varying slightly by market), and in single-motor rear-wheel drive or dual-motor all-wheel drive configurations, power outputs range from 149 HP to 320 HP in the performance-oriented dual-motor version. The aerodynamic design helps the IONIQ 6 achieve exceptional efficiency, with some configurations exceeding 360 miles of range. The interior continues the 'living space' concept with a flat floor and spacious cabin, featuring dual 12.3-inch screens under a single piece of glass, customizable ambient lighting, and sustainable materials."

  - name: "First Generation (2025 Facelift)"
    start_year: 2025
    end_year: null
    description: "The facelifted IONIQ 6 was revealed at the Seoul Mobility Show on April 3, 2025. It features a redesigned front and rear fascia under the 'Pure Flow, Refined' design concept, including refined curves, slim DRLs, and updated lighting elements. The interior received a redesigned steering wheel and enlarged climate control display. An N Line variant was also introduced with bold styling elements such as sculptural bumpers and Parametric Pixel lamps. The IONIQ 6 N performance variant was introduced in July 2025 at the Goodwood Festival of Speed, featuring a dual-motor AWD powertrain producing 478 kW (641 hp) with N Grin Boost, 770 Nm of torque, and an 84.0 kWh battery."